name: opencode-review

# On-demand, comment-triggered review. No automatic PR review.
# Comment "/oc review this PR" (or "/opencode ...") on a pull request.
# Only repository owners, members and collaborators may trigger a review.
#
# Requires: gh secret set OPENCODE_API_KEY
# The action supports issue_comment and pull_request_review_comment only.
# It may read code and post a review comment, but must not edit, push, approve,
# or merge: permissions are contents: read and issues: write.

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  review:
    if: |
      github.event.issue.pull_request &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      (contains(github.event.comment.body, '/oc') ||
       contains(github.event.comment.body, '/opencode'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Review pull request (comment only)
        uses: anomalyco/opencode/github@17b79f4e0c16dcff200b0417567ed22aeb2d7166
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: ${{ vars.OPENCODE_REVIEW_MODEL || 'opencode/deepseek-v4.1-flash-free' }}
          use_github_token: true
          share: false
          prompt: |
            Review this pull request and reply with findings only. Do not modify
            files, push commits, create branches, approve, or merge.

            Report concrete findings with file and line references, severity, and
            why each matters. Focus on behavior, data contracts, security, and
            regressions. If nothing material is wrong, say so briefly instead of
            inventing issues.
